name: Aero runtime
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aero-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/aero/tests/runtime/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: plugins/aero/tests/runtime
      - run: npm test
        working-directory: plugins/aero/tests/runtime
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: plugins/aero/tests/runtime
      - run: npm run test:browser
        working-directory: plugins/aero/tests/runtime
