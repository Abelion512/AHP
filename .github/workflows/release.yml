name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag against hermes.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          tag = os.environ["TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if not match:
              sys.exit(f"invalid release tag: {tag!r} (expected vMAJOR.MINOR.PATCH)")
          version = json.loads(Path("hermes.json").read_text(encoding="utf-8")).get("version")
          if version != match.group(1):
              sys.exit(f"tag {tag!r} does not match hermes.json version {version!r}")
          print(f"tag {tag} matches hermes.json {version}")
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Abelion Hermes Plugins $GITHUB_REF_NAME"
