name: labeler

# pull_request_target runs the workflow file from the base branch with write access.
# Safe here because nothing from the PR is checked out or executed: labeler only
# reads changed file names and the label config from the base branch.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    # Dependabot PRs get a read-only token here; their labels are set in dependabot.yml.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # add labels to the PR
      issues: write         # create labels that do not exist yet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            .github
            plugins
            hermes.json
      - name: Install label merge dependency
        run: python -m pip install --only-binary ':all:' PyYAML==6.0.3
      - name: Test label merge output
        run: |
          python -m unittest discover -s .github/tests -p test_labeler_output.py
          python -m unittest discover -s .github/scripts -p test_labeler_merge_step.py
      - name: merge plugin-local labels
        run: |
          python - <<'PY'
          import os, glob, yaml, json, sys

          repo = {} 
          repo_path = os.path.join(os.getcwd(), ".github", "labeler.yml")
          if os.path.exists(repo_path):
              with open(repo_path, encoding="utf-8") as f:
                  repo = yaml.safe_load(f) or {}

          combined = dict(repo)
          plugin_keys = set()

          def prefixed(path, rule):
              # Labeler v7 matches repo-root-relative paths; plugin-local
              # files document globs as plugin-relative -- prefix them.
              prefix = os.path.dirname(os.path.dirname(path)).replace("\\", "/")
              rule = json.loads(json.dumps(rule))  # deep copy
              for sec in (rule if isinstance(rule, list) else [rule]):
                  if not isinstance(sec, dict):
                      continue
                  for cf in sec.get("changed-files", []):
                      if not isinstance(cf, dict):
                          continue
                      gk = "any-glob-to-any-file"
                      if gk in cf:
                          globs = cf[gk] if isinstance(cf[gk], list) else [cf[gk]]
                          cf[gk] = [g if g.startswith(prefix + "/") else f"{prefix}/{g}" for g in globs]
              return rule

          def union_globs(existing, rule):
              # Same label name declared by another plugin: union the file
              # globs so the shared label covers every plugin declaring it.
              for sec in (existing if isinstance(existing, list) else [existing]):
                  if not isinstance(sec, dict):
                      continue
                  for cf in sec.get("changed-files", []):
                      if not isinstance(cf, dict):
                          continue
                      gk = "any-glob-to-any-file"
                      if gk not in cf:
                          continue
                      have = cf[gk] if isinstance(cf[gk], list) else [cf[gk]]
                      for nsec in (rule if isinstance(rule, list) else [rule]):
                          if not isinstance(nsec, dict):
                              continue
                          for ncf in nsec.get("changed-files", []):
                              if not isinstance(ncf, dict):
                                  continue
                              new = ncf.get(gk)
                              for g in (new if isinstance(new, list) else [new]):
                                  if g and g not in have:
                                      have.append(g)
                      cf[gk] = have

          for path in sorted(glob.glob("plugins/*/.github/labels.yml")):
              with open(path, encoding="utf-8") as f:
                  plugin = yaml.safe_load(f) or {}
              for key, rule in plugin.items():
                  if key in repo:
                      print(f"warn: plugin label {key!r} from {path} conflicts with a repo label; skipping", file=sys.stderr)
                      continue
                  rule = prefixed(path, rule)
                  if key in plugin_keys:
                      union_globs(combined[key], rule)
                      continue
                  plugin_keys.add(key)
                  combined[key] = rule

          with open("merged_labeler.yml", "w", encoding="utf-8") as f:
              yaml.safe_dump(combined, f, sort_keys=False)
          def write_outputs(stream):
              print("merged_labeler_path=merged_labeler.yml", file=stream)
              print("labels_count=%d" % len(combined), file=stream)

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as output:
                  write_outputs(output)
          else:
              write_outputs(sys.stdout)
          PY
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: merged_labeler.yml
          sync-labels: true
