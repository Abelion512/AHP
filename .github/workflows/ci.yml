name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly (Mon 02:00 UTC): a new CVE in an unchanged dependency is still caught.
    - cron: "0 2 * * 1"

# Least privilege: read-only checkout, no packages/id-token/deploy scopes.
permissions:
  contents: read

# Cancel a superseded pull_request run when a new commit is pushed to the same PR.
# The run attempt is part of the group so a rerun of an older run cannot cancel
# the current-head run: new pushes share attempt 1 and still supersede each other,
# while a rerun lands in its own group.
# Push, schedule and manual runs get a unique group and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Finds every plugin folder (any dir with a plugin.yaml). Runs only the plugins
  # touched by the change. A change outside any plugin folder (shared files such as
  # workflows, hermes.json, root tests), a schedule or a manual run checks all of them.
  # `relevant` is 0 only for a docs/Markdown/image-only change, so the credential
  # guard and secret scan still run on those PRs while the heavy jobs skip.
  detect:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.find.outputs.plugins }}
      relevant: ${{ steps.find.outputs.relevant }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          all=$(find . -name plugin.yaml -not -path './.git/*' -printf '%h\n' | sed 's|^\./||' | sort)
          base=""
          [ "$EVENT" = pull_request ] && base="$PR_BASE"
          [ "$EVENT" = push ] && base="$PUSH_BEFORE"
          changed=""
          if [ -n "$base" ] && ! echo "$base" | grep -qE '^0+$'; then
            changed=$(git diff --name-only "$base" HEAD 2>/dev/null) || base=""
          else
            base=""
          fi
          # A docs, Markdown or image change cannot alter plugin behaviour, so it
          # is excluded from selection instead of being treated as a shared change
          # that selects every plugin. Nothing to diff (schedule, manual, unknown
          # base) stays relevant so those runs keep doing their full job.
          relevant=1
          if [ -z "$base" ]; then
            sel="$all"
          else
            sel=""
            shared=0
            relevant=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                *.md|*.mdx|docs/*|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.webp) continue;;
              esac
              relevant=1
              hit=""
              for d in $all; do
                case "$f" in "$d"/*) hit="$d"; break;; esac
              done
              if [ -n "$hit" ]; then sel="$sel$hit"$'\n'; else shared=1; fi
            done <<< "$changed"
            [ "$shared" = 1 ] && sel="$all"
          fi
          json=$(printf '%s\n' "$sel" | sed '/^$/d' | sort -u | jq -R . | jq -sc .)
          {
            echo "plugins=$json"
            echo "relevant=$relevant"
          } | tee -a "$GITHUB_OUTPUT"

  # Protect existing Hermes profiles from stale plugin copies after a source rename.
  plugin-migration-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: test legacy-install preflight
        run: bash tests/test_update_plugins_migration.sh
      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
          cache: "pip"
          # Pinned pip packages live in this workflow; plugin deps in plugin.yaml.
          cache-dependency-path: |
            .github/workflows/ci.yml
            plugins/**/plugin.yaml
            plugins/**/plugin-requirements.txt
            plugins/**/requirements*.txt
      - name: test workflow script steps
        run: |
          python -m pip install --only-binary ':all:' pyyaml==6.0.3
          python .github/scripts/test_labeler_merge_step.py
          python .github/scripts/test_plugin_install_step.py
          python .github/scripts/test_ci_concurrency.py

  # Strict pre-merge credential guard: a PR that introduces a leaked secret, a
  # missing plugin manifest, or a bare provider-supplied key shape must not
  # become mergeable through labeling or review alone.
  credential-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: fail on obvious credential shapes in PR diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY' || exit 7
          import os, sys, re, subprocess
          sys.path.insert(0, ".github/scripts")
          from url_filter import strip_url_structure

          base = os.environ.get("PR_BASE", "").strip()
          if not base or re.fullmatch(r"0+", base):
              print("::warning::credential-guard: no meaningful base; skipping diff check")
              sys.exit(0)

          diff = subprocess.check_output(["git", "diff", "--unified=0", f"{base}..HEAD"], text=True)
          print("diff_bytes=%d" % len(diff.encode("utf-8")))
          # Guard scans its own PR diff; constants are split so these lines never self-match.
          pin = "9a85916c" + "87d56c2ca00b02" + "fad8918f93ef1816e9"
          canary = "ghp" + "_Ab1Cd2Ef3Gh4Ij5Kl6Mn7Op8Qr9St0Uv1Wx2"
          suspicious = []
          for line in diff.splitlines():
              # Only added lines are leak candidates; removals and diff headers false-positive.
              if not line.startswith("+") or line.startswith("+++"): continue
              if pin in line or canary in line: continue
              if re.match(r"^\+[0-9a-f]{40}:", line): continue
              if "uses:" in line and re.search(r"@[0-9a-f]{40}", line): continue
              # Pinned checksum commands are hashes by design; skip only when the whole added
              # line is exactly echo "<64-hex>  <file>" | sha256sum -c (a secret appended
              # anywhere breaks the fullmatch and is still caught below).
              if re.fullmatch(r"\+\s*echo\s+\"[0-9a-f]{64}  [^\"\s]+\"\s*\|\s*sha256sum\s+-c\s*-?\s*", line): continue
              low = line.lower()
              # A URL's scheme and host hold long benign runs. Keep path, query,
              # fragment and userinfo in `scanned`, so a secret there is still
              # checked. Explicit token shapes below use the full line.
              scanned = strip_url_structure(line)
              if re.search(r'(?<![A-Za-z0-9])[A-Za-z0-9+/]{40}(?![A-Za-z0-9+/=])', scanned):
                  suspicious.append(("long_base64_like", line[:120]))
              if re.search(r'(?<![A-Za-z0-9])[0-9a-f]{32,}(?![A-Za-z0-9])', scanned.lower()):
                  suspicious.append(("long_hex_like", line[:120]))
              if re.search(r'sk-(?:prod|pro|proj|live|test)-[A-Za-z0-9_\-]{20,}', low):
                  suspicious.append(("openai_key_shape", line[:120]))
              if re.search(r'aiza[0-9A-Za-z_\-]{30,}', low):
                  suspicious.append(("google_key_shape", line[:120]))
              if re.search(r'gh[pousr]_[A-Za-z0-9_\-]{20,}', low):
                  suspicious.append(("github_token_shape", line[:120]))
              if re.search(r'xox[bpsr]-[A-Za-z0-9_\-]{10,}', low):
                  suspicious.append(("slack_token_shape", line[:120]))
              if re.search(r'hf_[A-Za-z0-9_\-]{20,}', low):
                  suspicious.append(("huggingface_token_shape", line[:120]))
              if re.search(r'akia[0-9A-Z]{16}', low):
                  suspicious.append(("aws_key_shape", line[:120]))
          if suspicious:
              print("::error::possible credential leak in PR diff")
              for kind, hint in suspicious[:20]:
                  print(f"::error::  {kind}: {hint}")
              sys.exit(7)
          print("credential-guard: no obvious secret shape in diff")
      - name: warn on naked env files in changed tree
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD 2>/dev/null || true)
          else
            CHANGED=""
          fi
          if [ -n "$CHANGED" ]; then
            for f in $CHANGED; do
              case "$f" in
                *.env|*.env.*|*.env.sample|*.env.template|*.env.local)
                  echo "::warning::potential env file in diff: $f"
                  ;;
              esac
            done
          fi

  plugin:
    needs: detect
    if: needs.detect.outputs.relevant == '1' && needs.detect.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.1.0 (3.14 matches the pinned Hermes managed env)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
          cache: "pip"
          # Pinned pip packages live in this workflow; plugin deps in plugin.yaml.
          cache-dependency-path: |
            .github/workflows/ci.yml
            plugins/**/plugin.yaml
            plugins/**/plugin-requirements.txt
            plugins/**/requirements*.txt
      - name: install test deps and pip-audit
        env:
          P: ${{ matrix.plugin }}
        run: |
          python -m pip install --only-binary ':all:' pip-audit==2.10.1 pytest==9.1.1 packaging==26.3 pyyaml==6.0.3
          for f in "$P"/tests/requirements*.txt; do
            # No requirements file: the glob stays literal, so test for a real
            # file inside the loop instead of `[ -f ] &&` which exits 1 under -e.
            if [ -f "$f" ]; then
              python -m pip install -r "$f"
            fi
          done
      - name: dependency-floor parser unit tests
        run: python .github/scripts/test_dependency_floor_audit.py
      - name: syntax check
        env:
          P: ${{ matrix.plugin }}
        run: |
          python -m compileall -q "$P"
      - name: tests
        env:
          P: ${{ matrix.plugin }}
        run: |
          if [ -d "$P/tests" ]; then
            python -m pytest "$P/tests" -q --junitxml="$RUNNER_TEMP/${P##*/}-tests.xml"
          else
            echo "::error title=$P::plugin has no tests/ directory"
            exit 1
          fi
      - name: Unit test summary
        if: always()
        env:
          P: ${{ matrix.plugin }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          plugin = os.environ["P"]
          report = Path(os.environ["RUNNER_TEMP"]) / (plugin.rsplit("/", 1)[-1] + "-tests.xml")
          if not report.is_file():
              line = f"- {plugin}: JUnit report unavailable; inspect the test step log."
          else:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              counts = {name: sum(int(suite.attrib.get(name, 0)) for suite in suites)
                        for name in ("tests", "failures", "errors", "skipped")}
              line = (f"- **{plugin}**: {counts['tests']} tests, "
                      f"{counts['failures']} failures, {counts['errors']} errors, "
                      f"{counts['skipped']} skipped.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(line + "\n")
          PY
      - name: plugin dependency mirror
        env:
          P: ${{ matrix.plugin }}
        run: |
          python - "$P" <<'PY'
          import sys
          from pathlib import Path
          import yaml

          plugin = Path(sys.argv[1])
          manifest = yaml.safe_load((plugin / "plugin.yaml").read_text(encoding="utf-8")) or {}
          declared = manifest.get("python_dependencies") or []
          mirror = plugin / "plugin-requirements.txt"
          actual = []
          if mirror.is_file():
              actual = [
                  line.strip() for line in mirror.read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]
          if declared != actual:
              print("::error::plugin-requirements.txt must mirror plugin.yaml python_dependencies exactly")
              print("manifest:", declared)
              print("mirror:", actual)
              raise SystemExit(1)
          print(f"{plugin}: dependency mirror matches ({len(declared)} entries)")
          PY
      - name: dependency audit
        env:
          P: ${{ matrix.plugin }}
        run: |
          found=0
          while IFS= read -r f; do
            found=1
            echo "pip-audit $f"
            pip-audit -r "$f"
          done < <(find "$P" -name 'requirements*.txt' -o -name 'plugin-requirements.txt' | sort -u)
          [ "$found" = 1 ] || echo "no requirements files in $P"
      - name: dependency floor audit
        env:
          P: ${{ matrix.plugin }}
        run: |
          floors="$RUNNER_TEMP/dependency-floors.txt"
          python .github/scripts/audit_dependency_floors.py "$P/plugin.yaml" --output "$floors"
          if [ -s "$floors" ]; then
            pip-audit -r "$floors"
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # full history: a leaked secret in an old commit still counts
      - name: gitleaks (pinned version + verified checksum, no third-party action)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # Release/PR checks scan every commit reachable from the checked-out
          # candidate, not unrelated fetched audit branches. Keep repository-wide
          # monitoring on schedules and explicit manual runs.
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            ./gitleaks git --redact --verbose .
          else
            ./gitleaks git --redact --verbose --log-opts="--full-history HEAD --diff-filter=tuxdb" .
          fi

  # Repo-wide doc and manifest hygiene. A new plugin should not land with a
  # broken skill frontmatter, missing docs trio, or inconsistent status claim.
  doc-and-manifest-lint:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
          cache: "pip"
          # Pinned pip packages live in this workflow; plugin deps in plugin.yaml.
          cache-dependency-path: |
            .github/workflows/ci.yml
            plugins/**/plugin.yaml
            plugins/**/plugin-requirements.txt
            plugins/**/requirements*.txt
      - name: pip install pyyaml
        run: python -m pip install --only-binary ':all:' pyyaml==6.0.3
      - name: plugin contract unit tests
        run: python .github/scripts/test_plugin_contract.py
      - name: E2E matrix unit tests
        run: python .github/scripts/test_e2e_matrix.py
      - name: validate every plugin contract
        run: python .github/scripts/plugin_contract.py .
