name: Pylint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # diff against the PR/push base commit
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --prefer-binary pylint==4.1.4
    - name: Analyse changed Python files with pylint
      # Full Pylint (errors + warnings) on files this change touches. Legacy
      # files keep their existing debt instead of blocking unrelated PRs;
      # convention/refactor categories are disabled in .pylintrc because Ruff
      # is this repository's style gate. import-error stays enabled; only the
      # modules this job cannot install are exempted. PYTHONPATH includes
      # plugins/ and .github/scripts/ so their imports resolve.
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PYTHONPATH: ${{ github.workspace }}/plugins:${{ github.workspace }}/.github/scripts
      run: |
        base=""
        [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
        [ "$EVENT" = "push" ] && base="$PUSH_BEFORE"
        if [ -z "$base" ] || echo "$base" | grep -qE '^0+$' || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "::notice::no comparable base commit; no changed Python files to lint"
          exit 0
        fi
        # Fail on a diff error instead of treating an empty failed diff as "clean".
        if ! git diff -z --name-only --diff-filter=ACMRT "$base" HEAD -- '*.py' > changed.raw; then
          echo "::error::git diff failed; refusing to skip lint"
          exit 1
        fi
        # Harness fixtures (stronsium) and E2E support have their own suites;
        # other .github/ Python files, including scripts, are linted here.
        grep -zvE '(^|/)(tests|e2e)/|^\.github/(stronsium|e2e_support)/' changed.raw > changed.z || true
        if [ ! -s changed.z ]; then
          echo "No changed Python files require linting."
          exit 0
        fi
        echo "Linting:"
        tr '\0' '\n' < changed.z
        xargs -0 -r pylint < changed.z
